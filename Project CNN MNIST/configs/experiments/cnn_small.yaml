experiment:
  name: cnn_small

data:
  data_dir: data/processed
  batch_size: 128
  num_workers: 0

model:
  name: mnist_cnn
  num_classes: 10
  hidden_features: 64

training:
  epochs: 10
  loss: cross_entropy
  patience: 3

optimizer:
  name: adam
  lr: 0.001
  weight_decay: 0.0

scheduler:
  name: none

artifacts:
  checkpoint_dir: artifacts/checkpoints
